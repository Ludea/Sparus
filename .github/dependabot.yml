version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "src-tauri"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      rust-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      js-deps:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    groups:
      action-deps:
        patterns:
          - "*"
